# Ruff config for the StockSure backend (run from this folder: `ruff check .`)
target-version = "py312"
extend-exclude = [".venv"]

[lint]
select = [
    "E4", "E7", "E9", "F",  # core pycodestyle + pyflakes errors
    "I",             # import sorting
    "UP",            # modernise syntax
    "SIM",           # simplifications
    "BLE",           # no blind `except Exception`
    "RUF",           # ruff-specific
    "FURB",
    "EXE",
]
ignore = [
    # Django/DRF declare config as plain class attributes (permission_classes = [...],
    # Meta.fields = [...]). The framework never mutates them, so RUF012 is just noise here.
    "RUF012",
]

[lint.per-file-ignores]
# Auto-generated by Django; don't hand-edit or lint them.
"**/migrations/*.py" = ["I001", "RUF012", "E501"]
# Windows can't set the executable bit, so skip the shebang check for this file.
"manage.py" = ["EXE001"]
