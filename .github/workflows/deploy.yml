name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/build-lambda.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Run database migrations after the deploy
        type: boolean
        default: false

permissions:
  id-token: write # OIDC token for the AWS deploy role
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  STACK_NAME: stocksure-api
  ARTIFACT_BUCKET: stocksure-lambda-artifacts-866874944490

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Test-only values; the real ones live in the CloudFormation stack.
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show OIDC claims
        run: |
          set -euo pipefail
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$token" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build Lambda package
        run: bash scripts/build-lambda.sh

      - name: Upload package for debugging
        uses: actions/upload-artifact@v4
        with:
          name: lambda-zip-${{ github.sha }}
          path: backend/build/lambda.zip
          retention-days: 7

      - name: Package template
        working-directory: backend
        run: |
          aws cloudformation package \
            --template-file template.yaml \
            --s3-bucket "$ARTIFACT_BUCKET" \
            --s3-prefix stocksure \
            --output-template-file packaged.yaml

      - name: Deploy stack
        working-directory: backend
        env:
          # Optional JSON array of {"ParameterKey","ParameterValue"} entries.
          # Anything omitted keeps the value already on the stack.
          STACK_PARAMETERS_JSON: ${{ secrets.STACK_PARAMETERS_JSON }}
        run: |
          set -euo pipefail
          args=(
            deploy
            --template-file packaged.yaml
            --stack-name "$STACK_NAME"
            --region "$AWS_REGION"
            --capabilities CAPABILITY_IAM
            --no-fail-on-empty-changeset
          )
          if [ -n "${STACK_PARAMETERS_JSON:-}" ]; then
            printf '%s' "$STACK_PARAMETERS_JSON" > /tmp/stack-parameters.json
            args+=(--parameter-overrides file:///tmp/stack-parameters.json)
          fi
          aws cloudformation "${args[@]}"

      - name: Run migrations
        if: ${{ inputs.run_migrations }}
        run: |
          set -euo pipefail
          function_name=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='JobFunctionName'].OutputValue" \
            --output text)
          aws lambda invoke \
            --function-name "$function_name" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"job":"migrate"}' \
            response.json
          cat response.json
          if grep -q '"FunctionError"' response.json; then
            echo "Migration job failed." >&2
            exit 1
          fi

      - name: Deployment summary
        run: |
          set -euo pipefail
          outputs=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output json)
          {
            echo "### StockSure API deployed"
            echo
            echo "$outputs" | jq -r '.[] | "- **\(.OutputKey):** \(.OutputValue)"'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$outputs" | jq -r '.[] | "\(.OutputKey): \(.OutputValue)"'
